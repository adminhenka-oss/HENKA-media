<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Henka — Beranda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #150a22;
    --bg-panel: #1e1130;
    --bg-panel-2: #261638;
    --bg-raised: #2c1a40;
    --border: #382454;
    --text: #f3eefc;
    --text-muted: #a695c4;
    --text-faint: #6f5d8c;
    --accent: #9b6bff;
    --accent-deep: #6d28d9;
    --accent-soft: rgba(155,107,255,0.14);
    --ember: #ff8a5c;
    --ember-soft: rgba(255,138,92,0.16);
    --radius-card: 14px;
    --radius-pill: 999px;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg: #f6f3fb;
    --bg-panel: #ffffff;
    --bg-panel-2: #f0ebfa;
    --bg-raised: #ffffff;
    --border: #e1d7f2;
    --text: #241536;
    --text-muted: #6b5c85;
    --text-faint: #a394c0;
    --accent: #7c3aed;
    --accent-deep: #5b21b6;
    --accent-soft: rgba(124,58,237,0.10);
    --ember: #e8622f;
    --ember-soft: rgba(232,98,47,0.12);
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    padding-bottom: 84px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body.no-nav-pad{ padding-bottom:0; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }

  .brand-font{ font-family:'Cinzel', serif; letter-spacing: 0.02em; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 20px 8px;
  }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo-mark{
    width:40px; height:40px; border-radius:50%;
    flex-shrink:0; overflow:hidden;
  }
  .logo-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .logo-text{ font-size: 1.28rem; font-weight:700; }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  .theme-toggle{
    width:36px; height:36px; border-radius:50%;
    background: var(--bg-panel); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-muted); font-size: 0.95rem;
  }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background: linear-gradient(140deg, #4c2f78, #24152f);
    border: 1px solid var(--border); cursor:pointer;
  }

  main{ padding: 6px 20px 0; }

  .search-row{ display:flex; gap:10px; margin: 14px 0 22px; }
  .search-box{
    flex:1; display:flex; align-items:center; gap:10px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 12px 16px;
    color: var(--text-faint);
  }
  .search-box input{
    border:none; outline:none; background:transparent; color:var(--text);
    font-size: 0.95rem; width:100%; font-family:inherit;
  }
  .search-box input::placeholder{ color: var(--text-faint); }

  section{ margin-bottom: 30px; }
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 12px;
  }
  .section-title{ font-size: 1.3rem; font-weight:800; margin:0; }
  .section-link{ font-size:0.82rem; color: var(--accent); font-weight:600; }

  .tab-row{ display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; scrollbar-width:none; }
  .tab-row::-webkit-scrollbar{ display:none; }
  .tab{
    padding: 9px 18px; border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--text-muted); font-size:0.88rem; font-weight:700;
    white-space:nowrap; flex-shrink:0;
  }
  .tab.active{
    background: linear-gradient(135deg, var(--accent-deep), var(--accent));
    color:#fff; border-color: transparent;
    box-shadow: 0 6px 16px -6px rgba(124,58,237,0.6);
  }

  .card-row{
    display:flex; gap:14px; overflow-x:auto; padding-bottom:4px;
    scroll-snap-type: x proximity; scrollbar-width:none;
  }
  .card-row::-webkit-scrollbar{ display:none; }
  .card{
    flex-shrink:0; width: 132px; scroll-snap-align:start; cursor:pointer;
  }
  .cover{
    position:relative; width:132px; height:176px;
    border-radius: var(--radius-card);
    overflow:hidden; border:1px solid var(--border);
    display:flex; align-items:flex-end;
  }
  .cover-title{
    position:relative; z-index:2; padding:10px;
    font-family:'Cinzel', serif; font-weight:700; font-size:0.82rem;
    color:#fff; line-height:1.25;
    text-shadow: 0 2px 8px rgba(0,0,0,0.55);
  }
  .cover::after{
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.72) 100%);
  }
  .badge-row{
    position:absolute; top:8px; left:8px; right:8px; z-index:3;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .badge{
    font-size:0.62rem; font-weight:800; padding:3px 7px; border-radius:6px;
    background: rgba(0,0,0,0.45); color:#fff; backdrop-filter: blur(2px);
  }
  .badge.new{ background: var(--ember); }
  .card-meta{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:8px; font-size:0.72rem; color: var(--text-faint);
  }
  .card-name{
    font-size:0.86rem; font-weight:700; margin-top:8px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; line-height:1.3; min-height: 2.6em;
  }

  .grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:14px;
  }
  .grid .card{ width:auto; }
  .grid .cover{ width:100%; }

  .progress-track{
    height:3px; background: var(--border); border-radius:2px; margin-top:6px; overflow:hidden;
  }
  .progress-fill{ height:100%; background: var(--ember); }

  /* Detail page */
  .detail-view{ background: var(--bg); min-height:100vh; }
  .detail-hero{ position:relative; height:230px; overflow:hidden; }
  .detail-banner{ position:absolute; inset:0; filter: blur(20px) saturate(1.15); transform:scale(1.2); }
  .detail-hero::after{
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, var(--bg) 94%);
  }
  .detail-topbar{
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; justify-content:space-between; padding:16px;
  }
  .circle-btn{
    width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,0.2);
    background: rgba(20,10,30,0.4); color:#fff; font-size:1.05rem;
    display:flex; align-items:center; justify-content:center; backdrop-filter: blur(4px);
  }
  .circle-btn svg{ width:19px; height:19px; }
  .detail-body{ padding: 4px 20px 24px; margin-top:-40px; position:relative; z-index:2; }
  .status-line{
    display:flex; align-items:center; gap:8px; color: var(--accent);
    font-weight:700; font-size:0.9rem; margin-bottom:10px;
  }
  .detail-title{ font-size:1.55rem; font-weight:800; line-height:1.25; margin:0 0 14px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .chip{
    padding:7px 14px; border-radius: var(--radius-pill); border:1px solid var(--border);
    font-size:0.8rem; font-weight:700; color:var(--text-muted);
    display:flex; align-items:center; gap:5px;
  }
  .chip.rating{ color: var(--ember); border-color: var(--ember-soft); }
  .chip.chip-clickable{ cursor:pointer; }
  .action-row{ display:flex; gap:12px; margin-bottom:8px; }
  .btn-read, .btn-bookmark{
    flex:1; padding:15px; border-radius: var(--radius-pill); border:none;
    font-weight:800; font-size:0.96rem;
  }
  .btn-read{ background: var(--bg-raised); color: var(--text); }
  .btn-bookmark{ background: var(--accent-soft); color: var(--accent); transition: background .15s, color .15s; }
  .btn-bookmark.active{ background: var(--accent); color:#fff; }
  .stat-row{
    display:flex; justify-content:space-around; color: var(--text-faint);
    font-size:0.8rem; margin: 10px 0 22px;
  }
  .detail-subhead{ font-size:1.1rem; font-weight:800; margin: 0 0 10px; }
  .synopsis{ color: var(--text-muted); line-height:1.65; font-size:0.9rem; margin:0; }
  .synopsis.clamped{
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .expand-btn{
    display:block; margin:8px auto 22px; background:none; border:none;
    color: var(--text-faint); font-size:1.15rem;
  }
  .chapter-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .sort-btn{ background:none; border:none; color:var(--accent); font-weight:700; font-size:0.85rem; }
  .chapter-list{ display:flex; flex-direction:column; }
  .chapter-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px; border-bottom:1px solid var(--border);
  }
  .chapter-row-title{ font-weight:700; font-size:0.9rem; }
  .chapter-row-date{ font-size:0.76rem; color: var(--text-faint); }

  /* Riwayat / history page */
  .riwayat-view{ background: var(--bg); min-height:100vh; }
  .riwayat-header{
    text-align:center; padding: 26px 20px 18px;
    border-bottom: 1px solid var(--border);
  }
  .riwayat-header h1{ font-size:1.5rem; font-weight:800; margin:0 0 6px; }
  .riwayat-header p{ margin:0; color: var(--text-muted); font-size:0.85rem; }
  .history-wrap{ padding: 22px 20px 10px; }
  .history-group{ position:relative; padding-left:2px; margin-bottom:4px; }
  .history-group::before{
    content:""; position:absolute; left:15px; top:40px; bottom:2px;
    width:2px; background: var(--border);
  }
  .history-group:last-child::before{ display:none; }
  .date-pill{
    display:inline-block; padding:9px 20px; border-radius: var(--radius-pill);
    background: var(--accent-deep); color:#fff; font-weight:800;
    font-size:0.92rem; margin-bottom:16px;
  }
  .history-card{
    display:flex; gap:14px; background: var(--bg-panel);
    border:1px solid var(--border); border-radius:14px;
    padding:14px; margin-bottom:20px; cursor:pointer;
  }
  .history-cover{ width:62px; height:84px; border-radius:10px; flex-shrink:0; }
  .history-info{ flex:1; min-width:0; }
  .history-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .history-title{ font-weight:800; font-size:0.96rem; line-height:1.3; }
  .history-time{ font-size:0.84rem; color: var(--text-muted); font-weight:700; white-space:nowrap; }
  .history-chapter{ font-size:0.82rem; color: var(--text-muted); margin:4px 0 10px; }
  .history-progress-track{ height:5px; background: var(--border); border-radius:3px; overflow:hidden; }
  .history-progress-fill{ height:100%; background: var(--ember); }
  .history-progress-label{ text-align:right; font-size:0.78rem; color: var(--text-faint); margin-top:6px; }

  /* Koleksi page */
  .koleksi-view{ background: var(--bg); min-height:100vh; }
  .koleksi-header{
    text-align:center; padding: 26px 20px 18px;
    border-bottom: 1px solid var(--border);
  }
  .koleksi-header h1{ font-size:1.5rem; font-weight:800; margin:0 0 6px; }
  .koleksi-header p{ margin:0; color: var(--text-muted); font-size:0.85rem; }
  .koleksi-wrap{ padding: 22px 20px 10px; }
  .koleksi-empty{
    text-align:center; color: var(--text-faint); font-size:0.9rem;
    padding: 60px 20px; line-height:1.6;
  }

  /* Profil page */
  .profile-view{ background: var(--bg); min-height:100vh; }
  .profile-header{ text-align:center; padding: 34px 20px 6px; }
  .profile-avatar-lg{
    width:86px; height:86px; border-radius:50%; margin:0 auto 14px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border);
  }
  .profile-avatar-lg.linked{ background: linear-gradient(140deg, var(--accent), var(--accent-deep)); }
  .profile-avatar-lg.guest{ background: var(--bg-panel); color: var(--text-faint); }
  .profile-avatar-lg svg{ width:38px; height:38px; }
  .profile-name{ font-size:1.2rem; font-weight:800; }
  .profile-sub{ color: var(--text-muted); font-size:0.85rem; margin-top:4px; }

  .link-banner{
    margin: 20px 20px 4px; padding:16px; border-radius:16px;
    display:flex; gap:12px; align-items:flex-start;
    background: var(--accent-soft); border:1px solid var(--accent-deep);
  }
  .link-banner .l-icon{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    background: var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .link-banner .l-icon svg{ width:19px; height:19px; }
  .link-banner-text strong{ display:block; font-size:0.94rem; margin-bottom:4px; }
  .link-banner-text p{ margin:0; font-size:0.81rem; color: var(--text-muted); line-height:1.5; }
  .link-btn{
    margin-top:12px; padding:10px 20px; border-radius: var(--radius-pill);
    background: var(--accent); color:#fff; font-weight:800; font-size:0.83rem; border:none;
  }

  .profile-stats{
    display:flex; justify-content:space-around; margin:24px 20px;
    padding:16px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  }
  .profile-stats div{ text-align:center; }
  .profile-stats .num{ font-weight:800; font-size:1.1rem; }
  .profile-stats .plabel{ font-size:0.72rem; color: var(--text-faint); margin-top:2px; }

  .profile-menu{ padding: 6px 20px 30px; }
  .profile-menu-item{
    display:flex; align-items:center; gap:14px; padding:15px 4px;
    border-bottom:1px solid var(--border);
  }
  .profile-menu-item .m-icon{
    width:36px; height:36px; border-radius:10px; background: var(--bg-panel);
    border:1px solid var(--border); display:flex; align-items:center;
    justify-content:center; flex-shrink:0; color: var(--text-muted);
  }
  .profile-menu-item .m-icon svg{ width:18px; height:18px; }
  .profile-menu-item .m-label{ flex:1; font-weight:600; font-size:0.92rem; }
  .profile-menu-item .m-chev{ color: var(--text-faint); }
  .profile-menu-item.locked{ opacity:0.5; }
  .profile-menu-item[data-action]{ cursor:pointer; }
  .profile-menu-item.danger .m-label{ color: var(--ember); }

  /* Search overlay */
  .search-view{ background: var(--bg); min-height:100vh; }
  .search-view-top{ display:flex; align-items:center; gap:10px; padding:16px 20px 8px; }
  .search-view-top .search-box{ flex:1; }
  .search-results{ padding: 6px 20px 4px; }
  .search-results-label{ font-size:0.8rem; color: var(--text-faint); margin-bottom:8px; }
  .search-result-row{
    display:flex; align-items:center; gap:12px; padding:10px 2px;
    border-bottom:1px solid var(--border); cursor:pointer;
  }
  .search-result-cover{ width:44px; height:58px; border-radius:8px; flex-shrink:0; }
  .search-result-title{ font-weight:700; font-size:0.9rem; }
  .search-result-sub{ font-size:0.76rem; color: var(--text-faint); margin-top:2px; }
  .search-empty{ padding:14px 2px 22px; color: var(--text-faint); font-size:0.85rem; }
  .circle-btn.has-active{ background: var(--accent); border-color: transparent; }
  .filter-panel{
    margin: 0 20px 18px; padding:16px; border-radius:16px;
    background: var(--bg-panel); border:1px solid var(--border);
  }
  .filter-panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .filter-panel-head h3{ margin:0; font-size:1rem; font-weight:800; }
  .filter-reset-btn{ background:none; border:none; color: var(--text-faint); font-weight:700; font-size:0.82rem; }
  .filter-chip-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .filter-chip{
    padding:8px 14px; border-radius: var(--radius-pill); border:1px solid var(--accent-deep);
    background:transparent; color: var(--text-muted); font-size:0.82rem; font-weight:600;
  }
  .filter-chip.active{ background: var(--accent); color:#fff; border-color: transparent; }
  .filter-apply-btn{
    width:100%; padding:12px; border-radius: var(--radius-pill); border:none;
    background: var(--accent); color:#fff; font-weight:800; font-size:0.88rem;
  }

  /* Admin panel */
  .admin-view{ background: var(--bg); min-height:100vh; }
  .admin-top{ display:flex; align-items:center; gap:12px; padding:20px 20px 8px; }
  .admin-top h1{ margin:0; font-size:1.2rem; font-weight:800; }
  .admin-top .circle-btn{ background: var(--bg-panel); border-color: var(--border); }
  .admin-toast{
    margin: 12px 20px 0; padding:10px 14px; border-radius:10px;
    background: var(--accent-soft); color: var(--accent);
    font-size:0.82rem; font-weight:700; text-align:center;
  }
  .admin-form{ padding: 16px 20px 6px; display:flex; flex-direction:column; gap:12px; }
  .admin-field label{ display:block; font-size:0.78rem; color: var(--text-muted); margin-bottom:6px; font-weight:700; }
  .admin-field input, .admin-field select{
    width:100%; padding:12px 14px; border-radius:12px; background: var(--bg-panel);
    border:1px solid var(--border); color: var(--text); font-size:0.9rem; font-family:inherit;
  }
  .admin-field input[type="file"]{ padding:10px 12px; font-size:0.82rem; color: var(--text-muted); }
  .admin-row-2{ display:flex; gap:10px; }
  .admin-row-2 .admin-field{ flex:1; }
  .admin-submit{
    margin-top:6px; padding:14px; border-radius: var(--radius-pill); border:none;
    background: var(--accent); color:#fff; font-weight:800; font-size:0.95rem;
  }
  .admin-list{ padding: 22px 20px 30px; }
  .admin-list h3{ font-size:1rem; font-weight:800; margin:0 0 10px; }
  .admin-item{ display:flex; align-items:center; gap:12px; padding:10px 2px; border-bottom:1px solid var(--border); }
  .admin-item .a-cover{ width:40px; height:54px; border-radius:8px; flex-shrink:0; }
  .admin-item .a-info{ flex:1; min-width:0; }
  .admin-item .a-title{ font-weight:700; font-size:0.88rem; }
  .admin-item .a-sub{ font-size:0.75rem; color: var(--text-faint); margin-top:2px; }
  .admin-item .a-delete{ background:none; border:none; color: var(--ember); font-size:0.8rem; font-weight:700; flex-shrink:0; }
  .admin-empty{ color: var(--text-faint); font-size:0.85rem; padding:10px 2px; }
  .admin-field textarea{
    width:100%; padding:12px 14px; border-radius:12px; background: var(--bg-panel);
    border:1px solid var(--border); color: var(--text); font-size:0.88rem;
    font-family:inherit; resize:vertical;
  }

  /* Reader */
  .reader-view{ background:#000; min-height:100vh; }
  .reader-top{
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    position:sticky; top:0; background:rgba(10,5,15,0.88);
    backdrop-filter: blur(6px); z-index:5;
  }
  .reader-title{ color:#fff; font-weight:700; font-size:0.9rem; }
  .reader-chapter{ color:rgba(255,255,255,0.6); font-size:0.76rem; margin-top:1px; }
  .reader-pages img{ width:100%; display:block; }
  .reader-empty{ color: var(--text-faint); text-align:center; padding:70px 30px; line-height:1.7; }

  nav.bottom{
    position:fixed; bottom:0; left:0; right:0;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    display:flex; justify-content:space-around; align-items:center;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color: var(--text-faint); font-size:0.68rem; font-weight:700;
    background:none; border:none; width:64px;
  }
  .nav-item.active{ color: var(--accent); }
  .nav-item svg{ width:21px; height:21px; }

  @media (min-width: 720px){
    main{ max-width: 960px; margin:0 auto; }
    header{ max-width:960px; margin:0 auto; width:100%; }
    .grid{ grid-template-columns: repeat(6,1fr); }
  }
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#150a22">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAeAAAAHgCAYAAAB91L6VAAEAA
